<!doctype html>
<!-- The LEGOLAND port's page (ROADMAP.md phase 10), Emscripten's shell for legoland.js: the game's files live in
     this site's private storage in the browser (OPFS); the first time, the player chooses the CD's image, which is
     copied there for the game's setup to install from (port/port_setup_sdl.c). The game runs in threads, which need
     the page to be cross-origin isolated: coi-serviceworker.js arranges that on hosts that can't send the headers.
     Its texts come in the setup window's languages (port/port_setup_win.c), the browser's first; saved games can be
     exported to a .zip and imported back. The look: a sky over a LEGO baseplate, CSS only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEGOLAND</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="coi-serviceworker.js"></script>
<style>
  /* A park on a sunny day: a sky with clouds over a green baseplate, the page as a white card. CSS only: no game art
     (the game's files are copyrighted) and no outside fonts (the page is cross-origin isolated). */
  :root {
    --ink: #1d2333; --muted: #5b6275; --card: #fffdf8; --line: #e4e1d8;
    --red: #e3000b; --red-dark: #a30008; --yellow: #ffd500; --yellow-dark: #c9a400; --blue: #006cb7; --green: #3c9a3c;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Segoe UI", system-ui, sans-serif;
  }
  html, body { margin: 0; min-height: 100%; }
  body { color: var(--ink); font: 16px/1.5 var(--font); overflow-x: hidden; }
  #canvas { display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; background: #000; outline: none; z-index: 10; }

  .sky { position: fixed; inset: 0; z-index: -2; background: linear-gradient(#2f8fe0 0%, #6cbaf5 45%, #b9e3fd 80%); }
  .cloud { position: absolute; width: 9rem; height: 2.6rem; background: #fff; border-radius: 2rem; opacity: .9;
    animation: drift 70s linear infinite; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 3.6rem; height: 3.6rem; left: 1.4rem; top: -1.7rem; }
  .cloud::after { width: 4.6rem; height: 4.6rem; left: 3.6rem; top: -2.4rem; }
  .cloud.c1 { top: 12%; left: -12rem; }
  .cloud.c2 { top: 26%; left: -12rem; transform: scale(.7); animation-duration: 95s; animation-delay: -40s; }
  .cloud.c3 { top: 6%; left: -12rem; transform: scale(.5); animation-duration: 120s; animation-delay: -80s; }
  @keyframes drift { to { left: 110%; } }
  @media (prefers-reduced-motion: reduce) { .cloud { animation: none; left: 70%; } .cloud.c2 { left: 15%; } .cloud.c3 { left: 45%; } }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  html { background: linear-gradient(#2f8fe0, #b9e3fd 70%, var(--green) 70%); }
  .base { flex: 1 0 auto; margin-top: -3.5rem; padding: 4.8rem 1rem 2rem; border-top: 6px solid #2c7a2c;
    background-color: var(--green);
    background-image: radial-gradient(circle at 50% 42%, #6cc56c 0 22%, #4fae4f 24% 30%, #2f7f2f 32% 36%, transparent 38%);
    background-size: 26px 26px; }

  .page { box-sizing: border-box; width: 100%; max-width: 38rem; margin: 0 auto; padding: 1rem 1rem 0; position: relative; z-index: 1; }
  .topbar { display: flex; justify-content: flex-end; }
  select { font: inherit; font-size: .9rem; padding: .3rem .6rem; border-radius: 999px; border: 2px solid #ffffffb0;
    background: #ffffff30; color: #fff; font-weight: 700; cursor: pointer; backdrop-filter: blur(4px); }
  select option { color: var(--ink); }
  header { text-align: center; margin: 1.5rem 0 1.2rem; }
  h1 { margin: 0; font-size: clamp(2.8rem, 11vw, 4.6rem); line-height: 1; font-weight: 900; letter-spacing: .02em;
    color: var(--yellow); text-shadow: 0 .06em 0 var(--red), 0 .12em 0 var(--red-dark), 0 .25em .5em #0000004d; }
  .tagline { margin: .9rem 0 0; color: #fff; font-size: 1.1rem; font-weight: 700; text-shadow: 0 2px 6px #00000059; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; margin-top: 1rem; }
  .chip { display: inline-flex; align-items: center; gap: .45rem; padding: .3rem .8rem; border-radius: 999px;
    background: #ffffffd9; font-size: .85rem; font-weight: 700; box-shadow: 0 2px 0 #0000001a; }
  .chip::before { content: ""; width: .65rem; height: .65rem; border-radius: 3px; background: var(--c); box-shadow: inset 0 -2px 0 #00000033; }

  #panel { text-align: center; background: var(--card); border-radius: 20px; padding: 1.5rem 1.6rem 1.3rem; border: 3px solid #fff;
    box-shadow: 0 10px 0 #0000001f, 0 24px 48px #00305c40; }
  #steps h2 { margin: 0 0 .7rem; font-size: 1.15rem; font-weight: 800; }
  #steps ol { list-style: none; margin: 0 0 1rem; padding: 0; counter-reset: step; }
  #steps li { counter-increment: step; margin: .7rem auto; max-width: 30rem; }
  #steps li::before { content: counter(step); display: grid; margin: 0 auto .3rem; width: 1.9rem; height: 1.9rem;
    border-radius: 6px; display: grid; place-items: center; color: #fff; font-weight: 900; background: var(--red);
    box-shadow: inset 0 -3px 0 #00000040, 0 2px 0 #0000001f; }
  #steps li:nth-child(2)::before { background: var(--yellow); color: var(--ink); }
  #steps li:nth-child(3)::before { background: var(--blue); }
  #status { font-weight: 700; margin: .6rem 0; }
  #status:empty { display: none; }
  p { margin: .6rem 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; margin-top: .9rem; }
  .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; margin-top: 1rem; padding-top: 1rem; border-top: 2px dashed var(--line); }
  button, label.button { display: inline-flex; align-items: center; justify-content: center; margin: 0; padding: .7rem 1.3rem;
    border: 0; border-radius: 12px; font: inherit; font-weight: 800; cursor: pointer; color: var(--ink);
    background: var(--yellow); box-shadow: inset 0 -4px 0 var(--yellow-dark), 0 3px 0 #0000001f;
    transition: transform .08s, filter .15s; -webkit-tap-highlight-color: transparent; }
  button:hover, label.button:hover { filter: brightness(1.06); transform: translateY(-1px); }
  button:active, label.button:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 var(--yellow-dark); }
  button:focus-visible, label.button:focus-within, select:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  #play { background: var(--red); color: #fff; font-size: 1.15rem; padding: .8rem 2rem; box-shadow: inset 0 -4px 0 var(--red-dark), 0 3px 0 #0000001f; }
  #play:active { box-shadow: inset 0 -2px 0 var(--red-dark); }
  button.secondary, label.secondary { background: #fff; color: var(--muted); font-weight: 700; font-size: .9rem; padding: .5rem .9rem;
    box-shadow: inset 0 0 0 2px var(--line), 0 2px 0 #0000000d; }
  button.secondary:active, label.secondary:active { box-shadow: inset 0 0 0 2px var(--line); }
  input[type=file] { display: none; }
  .option { display: inline-flex; align-items: center; gap: .5rem; margin-top: .9rem; font-weight: 700; cursor: pointer; }
  .option input { width: 1.2rem; height: 1.2rem; accent-color: var(--red); cursor: pointer; }
  progress { width: 100%; height: .9rem; border-radius: 999px; overflow: hidden; border: 0; background: #ece9df; appearance: none; }
  progress::-webkit-progress-bar { background: #ece9df; }
  progress::-webkit-progress-value { background: linear-gradient(90deg, var(--red), var(--yellow)); border-radius: 999px; }
  progress::-moz-progress-bar { background: linear-gradient(90deg, var(--red), var(--yellow)); border-radius: 999px; }
  footer { max-width: 36rem; margin: 0 auto; text-align: center; color: #fff; font-size: .85rem; padding: .7rem 1rem;
    background: #0f3d0fb3; border-radius: 14px; backdrop-filter: blur(2px); }
  footer p { margin: .3rem 0; }
  footer a { color: #fff; font-weight: 800; }
  .hidden { display: none !important; }
  @media (max-width: 30rem) { #panel { padding: 1.2rem 1rem; border-radius: 16px; } .actions > * { flex: 1 1 auto; } }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div class="sky" aria-hidden="true"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
<div class="page">
  <div class="topbar"><select id="lang" aria-label="Language"></select></div>
  <header>
    <h1>LEGOLAND</h1>
    <p class="tagline" data-t="tagline"></p>
    <div class="chips">
      <span class="chip" style="--c: var(--red)" data-t="feat1"></span>
      <span class="chip" style="--c: var(--yellow)" data-t="feat2"></span>
      <span class="chip" style="--c: var(--blue)" data-t="feat3"></span>
    </div>
  </header>
  <main id="panel">
    <div id="steps">
      <h2 data-t="howTo"></h2>
      <ol><li data-t="step1"></li><li data-t="step2"></li><li data-t="step3"></li></ol>
    </div>
    <p id="status">Loading...</p>
    <progress id="progress" class="hidden"></progress>
    <div id="choose" class="hidden">
      <p class="muted" data-t="choose"></p>
      <div class="actions">
        <label class="button" for="iso" data-t="chooseButton"></label>
        <input type="file" id="iso" accept=".iso,.bin,application/x-iso9660-image">
      </div>
    </div>
    <div id="ready" class="hidden">
      <p data-t="installed"></p>
      <div class="actions"><button id="play"></button></div>
      <label class="option"><input type="checkbox" id="level-music"> <span data-t="levelMusic"></span></label>
      <p class="muted" id="instruments-note" data-t="instrumentsNote"></p>
      <div class="tools">
        <label class="button secondary" for="instruments" id="instruments-button" data-t="instrumentsButton"></label>
        <input type="file" id="instruments" accept=".dls,.sf2">
        <button id="export" class="secondary" data-t="export"></button>
        <label class="button secondary" for="import" data-t="import"></label>
        <input type="file" id="import" accept=".zip,application/zip">
        <button id="trace" class="secondary hidden" data-t="trace"></button>
        <button id="remove" class="secondary" data-t="remove"></button>
      </div>
    </div>
  </main>
</div>
<div class="base">
  <footer>
    <p data-t="footer"></p>
    <p><a href="https://github.com/facundosterzerforino/legoland-port" data-t="source"></a></p>
    <p data-t="disclaimer"></p>
  </footer>
</div>

  const SAVE_FILE = /^(profile\d+\.txt|\d+save\d+\.(sav|sh))$/i;

  async function profilesFolder(create) {

  const CRC_TABLE = (() => {
    const table = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      table[n] = c >>> 0;
    }
    return table;
  })();

  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  /* a .zip of the files as they are (stored, no compression: they're small) */
  function makeZip(files) {
    const parts = [];
    const central = [];
    let offset = 0;
    const now = new Date();
    const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    for (const { name, data } of files) {
      const nameBytes = new TextEncoder().encode(name);
      const crc = crc32(data);
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0x0800, true); /* UTF-8 names */
      local.setUint16(10, time, true);
      local.setUint16(12, date, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, data.length, true);
      local.setUint32(22, data.length, true);
      local.setUint16(26, nameBytes.length, true);
      parts.push(local.buffer, nameBytes, data);
      const entry = new DataView(new ArrayBuffer(46));
      entry.setUint32(0, 0x02014b50, true);
      entry.setUint16(4, 20, true);
      entry.setUint16(6, 20, true);
      entry.setUint16(8, 0x0800, true);
      entry.setUint16(12, time, true);
      entry.setUint16(14, date, true);
      entry.setUint32(16, crc, true);
      entry.setUint32(20, data.length, true);
      entry.setUint32(24, data.length, true);
      entry.setUint16(28, nameBytes.length, true);
      entry.setUint32(42, offset, true);
      central.push(entry.buffer, nameBytes);
      offset += 30 + nameBytes.length + data.length;
    }
    const centralSize = central.reduce((n, part) => n + part.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, centralSize, true);
    end.setUint32(16, offset, true);
    return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
  }

  /* the files of a .zip (stored or deflated), by its central directory */
  async function readZip(blob) {
    const bytes = new Uint8Array(await blob.arrayBuffer());
    const view = new DataView(bytes.buffer);
    let end = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 22 - 65535); i--) {
      if (view.getUint32(i, true) === 0x06054b50) { end = i; break; }
    }
    if (end < 0) return [];
    const count = view.getUint16(end + 10, true);
    let p = view.getUint32(end + 16, true);
    const files = [];
    for (let k = 0; k < count && view.getUint32(p, true) === 0x02014b50; k++) {
      const method = view.getUint16(p + 10, true);
      const size = view.getUint32(p + 20, true);
      const nameLength = view.getUint16(p + 28, true);
      const extraLength = view.getUint16(p + 30, true);
      const commentLength = view.getUint16(p + 32, true);
      const local = view.getUint32(p + 42, true);
      const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLength));
      const start = local + 30 + view.getUint16(local + 26, true) + view.getUint16(local + 28, true);
      let data = bytes.subarray(start, start + size);
      if (method === 8) {
        data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(
          new DecompressionStream('deflate-raw'))).arrayBuffer());
      } else if (method !== 0) {
        data = null;
      }
      if (data) files.push({ name, data });
      p += 46 + nameLength + extraLength + commentLength;
    }
    return files;
  }

    const profiles = await profilesFolder(true);
    for await (const [name, handle] of profiles.entries()) {
      if (handle.kind === 'file' && SAVE_FILE.test(name)) await profiles.removeEntry(name);
    }
    for (const { name, data } of saves) {
      const out = await (await profiles.getFileHandle(name, { create: true })).createWritable();
      await out.write(data);
      await out.close();
    }
    setStatus('imported', { n: saves.length });
  });

  /* the chosen image, streamed into the game's folder (no copy in memory) */
  document.getElementById('iso').addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;
    if (navigator.storage.persist) navigator.storage.persist();
    show('choose', false);
    show('progress', true);
    setStatus('copying', { name: file.name });
    try {
      const folder = await gameFolder(true);
      const name = /\.bin$/i.test(file.name) ? 'cd.bin' : 'cd.iso';
      const handle = await folder.getFileHandle(name, { create: true });
      const out = await handle.createWritable();
      const reader = file.stream().getReader();
      let done = 0;
      progress.max = file.size;
      for (;;) {
        const { value, done: end } = await reader.read();
        if (end) break;
        await out.write(value);
        done += value.length;
        progress.value = done;
      }
      await out.close();
    } catch (e) {
      setStatus('copyFailed', { err: String(e) });
      show('choose', true);
      return;
    }
    await refresh();
  });

  /* the music's instruments (gm.dls or a .sf2), into the game's folder */
  async function hasInstruments(pattern) {
    try {
      const folder = await gameFolder(false);
      for await (const [name] of folder.entries()) {
        if (pattern.test(name)) return true;
      }
    } catch (e) {}
    return false;
  }

  /* the release's free instruments (GeneralUser GS, next to this page), into the game's folder, once */
  async function addSoundFont() {
    if (await hasInstruments(/^gm\.dls$|\.sf2$/i)) return;
    try {
      const response = await fetch('GeneralUser-GS.sf2');
      if (!response.ok) return;
      const folder = await gameFolder(true);
      const out = await (await folder.getFileHandle('GeneralUser-GS.sf2', { create: true })).createWritable();
      await response.body.pipeTo(out);
    } catch (e) {
      console.warn('the SoundFont could not be stored: ' + e);
    }
  }

  /* The music's files (IMusic: 243 files, 3 MB) into the page's memory before the game starts (/imusic-mem, which
     miniwin/src/files.c reads them from): the game's music thread opens each of them, and an open in the site's
     storage from the game's threads takes tens of milliseconds, while the game waits for its music; here they're
     read all at once. */
  async function musicIntoMemory() {
    try {
      const folder = await gameFolder(false);
      let music = null;
      for await (const [name, handle] of folder.entries()) {
        if (handle.kind === 'directory' && name.toLowerCase() === 'imusic') music = handle;
      }
      if (!music) return;
      const files = [];
      for await (const [name, handle] of music.entries()) {
        if (handle.kind === 'file') files.push([name, handle]);
      }
      const data = await Promise.all(files.map(async ([name, handle]) =>
        [name, new Uint8Array(await (await handle.getFile()).arrayBuffer())]));
      Module.FS.mkdir('/imusic-mem');
      for (const [name, bytes] of data) Module.FS.writeFile('/imusic-mem/' + name, bytes);
    } catch (e) {
      console.warn('the music is read from the site\'s storage: ' + e);
    }
  }

  /* the game's start (Play, and tools/web/pagetest.py's -port-selftest) */
  window.startGame = async (args) => {
    await addSoundFont();
    await musicIntoMemory();
    Module.callMain(args);
  };

  document.getElementById('instruments').addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const folder = await gameFolder(true);
    const name = /\.dls$/i.test(file.name) ? 'gm.dls' : 'gm.sf2';
    const out = await (await folder.getFileHandle(name, { create: true })).createWritable();
    await out.write(file);
    await out.close();
    await refresh();
  });

  document.getElementById('remove').addEventListener('click', async () => {
    if (!confirm(t('removeConfirm'))) return;
    const root = await navigator.storage.getDirectory();
    await root.removeEntry('LEGOLAND', { recursive: true });
    await refresh();
  });

  var Module = {
    canvas: document.getElementById('canvas'),
    print: (text) => console.log(text),
    /* the game's trace lines ("[ticks] ...") as plain messages: a warning carries a stack, which is slow to take
       with the developer tools open (and the game's are deep) */
    printErr: (text) => (/^\[ *\d+\] /.test(text) ? console.log : console.warn)(text),
    noInitialRun: true,
    onRuntimeInitialized: () => { runtimeReady = true; refresh(); },
    onExit: () => {
      /* the sound stops with the game (SDL_Quit at the end of main closes it; this in case it didn't get there) */
      try { if (typeof SDL3 !== 'undefined' && SDL3.audioContext) SDL3.audioContext.close(); } catch (e) {}
      document.getElementById('canvas').style.display = 'none';
      document.getElementById('panel').style.display = '';
      if (document.fullscreenElement) document.exitFullscreen();
      refresh().then(() => setStatus('ended'));
    },
  };

  /* level music (extensions/ext_music.h): on unless turned off here (remembered in this browser) */
  const levelMusic = document.getElementById('level-music');
  try { levelMusic.checked = localStorage.getItem('legoland-level-music') !== '0'; } catch (e) { levelMusic.checked = true; }
  levelMusic.addEventListener('change', () => {
    try { localStorage.setItem('legoland-level-music', levelMusic.checked ? '1' : '0'); } catch (e) {}
  });

  document.getElementById('play').addEventListener('click', async () => {
    const canvas = document.getElementById('canvas');
    document.getElementById('panel').style.display = 'none';
    canvas.style.display = 'block';
    canvas.focus();
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    await window.startGame(levelMusic.checked ? [] : ['-no-level-music']);
  });

  applyTexts();
  refresh();
</script>
